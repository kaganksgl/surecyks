<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Süreç YKS</title>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="icon" type="image/x-icon" href="../images/logo.png">
</head>
<body>
    <div class="signup-container">
        <div class="form-card">
        <h1>Süreç YKS</h1>
        <p>Aramıza hoş geldin.</p>
        <form>
        <input type="text" placeholder="Adınız" id="fname" name="fname" required>
        <input type="text" placeholder="Soyadınız" id="lname" name="lname" required>
        <input type="text" placeholder="Email Adresiniz" id="email" name="email" required>
        <input type="password" placeholder="Şifreniz" id="password" name="password" required>
        <input type="password" placeholder="Şifrenizi Doğrulayın" id="confpassword" name="confpassword" required>
        <button class="submit-button" type="submit">Kayıt Ol</button>
        <div class="login-link"><a href="index.html">Zaten Hesabın Var Mı?</a></div>
        </form>
        </div>
    </div>
    <script src="../js/signup.js"></script>
</body>
</html>
