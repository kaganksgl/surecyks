<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Süreç YKS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../images/logo.png">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>Süreç YKS</h1>
        <p>Tekrar hoş geldin.</p>

        <form>
            <input type="text" placeholder="Email Adresiniz" id="email" name="email" required>
            <input type="password" placeholder="Şifreniz" id="password" name="password" required>

            <div class="auth-options">

                <label class="beni-hatirla">
                    <input type="checkbox">
                    Beni hatırla
                </label>

                <a href="#">Şifremi unuttum</a> <!--FIX HREF OR REMOVE COMPLETELY-->

            </div>

            <button class="submit-button" type="submit">Giriş Yap</button> <br>

        </form>

        <div class="login-link"><a href="signup.html" >Hesabın Yok Mu?</a></div>

    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
